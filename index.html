<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durak Online</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#065f46;
  font-family:Arial;
  color:white;
}

.table{
  height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  font-size:20px;
}

.hand{
  height:30vh;
  background:#022c22;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.card{
  width:60px;
  height:90px;
  background:white;
  color:black;
  border-radius:8px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-12px);
}

.pair{
  display:flex;
  gap:5px;
}
</style>
</head>

<body>

<div class="table" id="table"></div>
<div class="hand" id="hand"></div>
  <div style="text-align:center; margin: 10px;">
    <button id="actionBtn" onclick="nextTurn()" style="padding: 10px 20px; border-radius: 10px; border: none; background: #fbbf24; color: black; font-weight: bold; cursor: pointer;">
        БИТО / ВЗЯТЬ
    </button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let deck = []; // Колода
let hand = []; // Твои карты
let table = []; // Карты на столе
let trump = ""; // Козырь

// Масти и ранги
const suits = ["♠", "♥", "♦", "♣"];
const ranks = ["6", "7", "8", "9", "10", "J", "Q", "K", "A"];

// 1. Функция создания колоды
function createDeck() {
    let newDeck = [];
    for (let s of suits) {
        for (let r of ranks) {
            newDeck.push(r + s);
        }
    }
    // Перемешиваем
    return newDeck.sort(() => Math.random() - 0.5);
}

// 2. Старт игры
function startGame() {
    deck = createDeck();
    trump = deck[0].slice(-1); // Берем козырь из колоды
    drawCards();
    render();
    alert("Козырь на эту игру: " + trump);
}

// 3. Добор карт до 6 штук
function drawCards() {
    while (hand.length < 6 && deck.length > 0) {
        hand.push(deck.pop());
    }
}

// 4. Кнопка "БИТО"
function nextTurn() {
    table = []; // Очищаем стол
    drawCards(); // Добираем карты
    render(); // Обновляем экран
}

// 5. Логика боя (кто сильнее)
function canBeat(card, target) {
    const cardRank = card.slice(0, -1);
    const targetRank = target.slice(0, -1);
    const cardSuit = card.slice(-1);
    const targetSuit = target.slice(-1);

    if (cardSuit === targetSuit) {
        return ranks.indexOf(cardRank) > ranks.indexOf(targetRank);
    }
    return cardSuit === trump; // Бьем козырем, если масти разные
}

// Функция хода (нажать на карту)
function play(i) {
    const card = hand[i];
    
    if (table.length === 0) {
        table.push([card]);
        hand.splice(i, 1);
    } else {
        let lastPair = table[table.length - 1];
        if (lastPair.length === 1 && canBeat(card, lastPair[0])) {
            lastPair.push(card);
            hand.splice(i, 1);
        }
    }
    render();
}

// Отрисовка всего на экране
function render() {
    const handDiv = document.getElementById("hand");
    const tableDiv = document.getElementById("table");

    handDiv.innerHTML = "";
    hand.forEach((card, i) => {
        const el = document.createElement("div");
        el.className = "card";
        el.innerText = card;
        if (card.includes("♥") || card.includes("♦")) el.style.color = "red";
        el.onclick = () => play(i);
        handDiv.appendChild(el);
    });

    tableDiv.innerHTML = "";
    table.forEach(pair => {
        const wrap = document.createElement("div");
        wrap.className = "pair";
        pair.forEach(c => {
            const el = document.createElement("div");
            el.className = "card";
            el.innerText = c;
            if (c.includes("♥") || c.includes("♦")) el.style.color = "red";
            wrap.appendChild(el);
        });
        tableDiv.appendChild(wrap);
    });
}

startGame(); // Запускаем всё!
</script>

</body>
</html>
