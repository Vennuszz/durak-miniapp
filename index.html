<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Durak Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="margin:0; background:#0f172a; color:white; display:flex; align-items:center; justify-content:center; height:100vh; font-family:Arial">

  <div style="text-align:center">
    <h1>🃏 Durak Online</h1>
    <p id="user">Загрузка...</p>
    <button onclick="alert('Скоро игра 😎')" 
      style="padding:15px 25px; font-size:18px; border-radius:10px; border:none; background:#22c55e;">
      Найти игру
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const user = tg.initDataUnsafe?.user;
    document.getElementById("user").innerText =
      user ? `Привет, ${user.first_name}` : "Открой через Telegram";
  </script>

</body>
</html>
