<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durak Online</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#065f46;
  font-family:Arial;
  color:white;
}

.table{
  height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  font-size:20px;
}

.hand{
  height:30vh;
  background:#022c22;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.card{
  width:60px;
  height:90px;
  background:white;
  color:black;
  border-radius:8px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-12px);
}

.pair{
  display:flex;
  gap:5px;
}
</style>
</head>

<body>

<div class="table" id="table"></div>
<div class="hand" id="hand"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let hand = ["6♠","7♥","8♦","9♣","J♠","A♥"];
let table = [];

const handDiv = document.getElementById("hand");
const tableDiv = document.getElementById("table");

function render(){
  // рука
  handDiv.innerHTML="";
  hand.forEach((card,i)=>{
    const el=document.createElement("div");
    el.className="card";
    el.innerText=card;
    el.onclick=()=>play(i);
    handDiv.appendChild(el);
  });

  // стол
  tableDiv.innerHTML="";
  table.forEach(pair=>{
    const wrap=document.createElement("div");
    wrap.className="pair";

    pair.forEach(c=>{
      const el=document.createElement("div");
      el.className="card";
      el.innerText=c;
      wrap.appendChild(el);
    });

    tableDiv.appendChild(wrap);
  });
}

function play(i){
  const card = hand[i];

  // атака
  if(table.length===0){
    table.push([card]);
    hand.splice(i,1);
  }
  else{
    const last = table[table.length-1];

    // защита
    if(last.length===1){
      const attackCard = last[0];

      if(canBeat(card, attackCard)){
        last.push(card);
        hand.splice(i,1);
      }else{
        alert("Не бьётся");
      }
    }
  }

  render();
}

function canBeat(def, att){
  const rank=["6","7","8","9","10","J","Q","K","A"];

  const defRank=def.slice(0,-1);
  const attRank=att.slice(0,-1);

  const defSuit=def.slice(-1);
  const attSuit=att.slice(-1);

  if(defSuit===attSuit){
    return rank.indexOf(defRank)>rank.indexOf(attRank);
  }

  if(defSuit==="♠"){ // козырь
    return true;
  }

  return false;
}

render();
</script>

</body>
</html>
