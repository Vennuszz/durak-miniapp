<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durak Online</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#065f46;
  font-family:Arial;
  color:white;
}

.table{
  height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  font-size:40px;
}

.hand{
  height:30vh;
  background:#022c22;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.card{
  width:60px;
  height:90px;
  background:white;
  color:black;
  border-radius:8px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-12px);
}
</style>
</head>

<body>

<div class="table" id="table">🃏</div>
<div class="hand" id="hand"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// рука игрока
let hand = ["6♠","7♥","8♦","9♣","J♠","A♥"];

const handDiv = document.getElementById("hand");
const tableDiv = document.getElementById("table");

function render(){
  handDiv.innerHTML="";
  hand.forEach((card,i)=>{
    const el=document.createElement("div");
    el.className="card";
    el.innerText=card;
    el.onclick=()=>play(i);
    handDiv.appendChild(el);
  });
}

function play(i){
  const card=hand.splice(i,1)[0];
  tableDiv.innerText=card;
  render();
}

render();
</script>

</body>
</html>
